name: Build iOS Simulator App
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s $(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          xcodebuild -version
      - name: Write project files
        run: |
          mkdir -p $(dirname 'DDEGlassStore/AppsAndSearchViews.swift')
          cat > 'DDEGlassStore/AppsAndSearchViews.swift' <<'EOF_DDEGLASSSTORE_APPSANDSEARCHVIEWS_SWIFT'
          import SwiftUI

          struct AppsView: View {
              @EnvironmentObject private var store: StoreViewModel
              @State private var selected: StoreApp?
              private let categories = ["social networking", "photo editor", "music", "productivity", "games"]

              var body: some View {
                  NavigationStack {
                      ScrollView {
                          VStack(alignment: .leading, spacing: 18) {
                              ScreenTitle(eyebrow: "Browse the catalogue", title: "Apps")
                              Text("Explore popular App Store categories").font(.subheadline).foregroundStyle(.secondary)
                              ForEach(categories, id: \.self) { category in
                                  Button {
                                      store.searchText = category
                                      store.search(category)
                                      store.selectedTab = 2
                                  } label: {
                                      HStack {
                                          Text(category.capitalized).font(.headline)
                                          Spacer()
                                          Image(systemName: "arrow.up.right").foregroundStyle(.secondary)
                                      }.padding(16).background(.ultraThinMaterial, in: RoundedRectangle(cornerRadius: 18))
                                  }.buttonStyle(.plain)
                              }
                          }.padding(20)
                      }
                  }
              }
          }

          struct SearchView: View {
              @EnvironmentObject private var store: StoreViewModel
              @State private var selected: StoreApp?

              var body: some View {
                  NavigationStack {
                      ScrollView {
                          VStack(alignment: .leading, spacing: 18) {
                              ScreenTitle(eyebrow: "Find your next favourite", title: "Search")
                              HStack(spacing: 10) {
                                  Image(systemName: "magnifyingglass").foregroundStyle(.secondary)
                                  TextField("Apps, games and more", text: $store.searchText)
                                      .textInputAutocapitalization(.never).autocorrectionDisabled()
                                      .onChange(of: store.searchText) { _, value in
                                          store.search(value)
                                      }
                                  if !store.searchText.isEmpty {
                                      Button { store.searchText = ""; store.apps = [] } label: {
                                          Image(systemName: "xmark.circle.fill").foregroundStyle(.secondary)
                                      }
                                  }
                              }
                              .padding(15).background(.regularMaterial, in: Capsule())
                              if store.isLoading { ProgressView().frame(maxWidth: .infinity).padding() }
                              if let error = store.errorMessage {
                                  ContentUnavailableView("Search unavailable", systemImage: "wifi.exclamationmark",
                                                         description: Text(error))
                              }
                              ForEach(store.apps) { app in
                                  AppRow(app: app) { selected = app }
                              }
                              if store.apps.isEmpty && !store.searchText.isEmpty && !store.isLoading {
                                  ContentUnavailableView.search(text: store.searchText)
                              }
                          }.padding(20)
                      }
                      .sheet(item: $selected) { AppDetailView(app: $0) }
                  }
              }
          }
          EOF_DDEGLASSSTORE_APPSANDSEARCHVIEWS_SWIFT
          mkdir -p $(dirname 'DDEGlassStore/GlassStyle.swift')
          cat > 'DDEGlassStore/GlassStyle.swift' <<'EOF_DDEGLASSSTORE_GLASSSTYLE_SWIFT'
          import SwiftUI

          struct GlassCard<Content: View>: View {
              var radius: CGFloat = 26
              var padding: CGFloat = 16
              @ViewBuilder var content: Content

              var body: some View {
                  content
                      .padding(padding)
                      .background {
                          if #available(iOS 26.0, *) {
                              RoundedRectangle(cornerRadius: radius, style: .continuous)
                                  .fill(.clear)
                                  .glassEffect(.regular, in: RoundedRectangle(cornerRadius: radius, style: .continuous))
                          } else {
                              RoundedRectangle(cornerRadius: radius, style: .continuous)
                                  .fill(.ultraThinMaterial)
                          }
                      }
                      .overlay {
                          RoundedRectangle(cornerRadius: radius, style: .continuous)
                              .strokeBorder(
                                  LinearGradient(colors: [.white.opacity(0.30), .white.opacity(0.04)],
                                                 startPoint: .topLeading, endPoint: .bottomTrailing),
                                  lineWidth: 1
                              )
                      }
                      .shadow(color: .black.opacity(0.12), radius: 18, y: 9)
              }
          }

          struct CapsuleActionStyle: ButtonStyle {
              var prominent = false
              func makeBody(configuration: Configuration) -> some View {
                  configuration.label
                      .font(.system(.subheadline, design: .rounded, weight: .bold))
                      .foregroundStyle(prominent ? Color.white : Color.primary)
                      .padding(.horizontal, 18)
                      .padding(.vertical, 10)
                      .background {
                          if #available(iOS 26.0, *) {
                              Capsule().fill(.clear)
                                  .glassEffect(
                                      prominent ? .regular.tint(.blue).interactive() : .regular.interactive(),
                                      in: Capsule()
                                  )
                          } else {
                              Capsule().fill(prominent ? AnyShapeStyle(Color.accentColor.gradient) : AnyShapeStyle(.ultraThinMaterial))
                          }
                      }
                      .overlay(Capsule().strokeBorder(.white.opacity(configuration.isPressed ? 0.28 : 0.13)))
                      .scaleEffect(configuration.isPressed ? 0.94 : 1)
                      .brightness(configuration.isPressed ? 0.08 : 0)
                      .animation(.spring(response: 0.26, dampingFraction: 0.62), value: configuration.isPressed)
              }
          }

          struct AppArtwork: View {
              let app: StoreApp
              var size: CGFloat = 68
              var body: some View {
                  AsyncImage(url: app.artworkUrl512 ?? app.artworkUrl100) { phase in
                      switch phase {
                      case .success(let image):
                          image.resizable().scaledToFill()
                      case .failure:
                          fallback
                      default:
                          fallback.overlay { ProgressView().tint(.white) }
                      }
                  }
                  .frame(width: size, height: size)
                  .clipShape(RoundedRectangle(cornerRadius: size * 0.23, style: .continuous))
                  .overlay(RoundedRectangle(cornerRadius: size * 0.23).strokeBorder(.white.opacity(0.18)))
                  .shadow(color: .black.opacity(0.16), radius: 9, y: 5)
              }
              private var fallback: some View {
                  RoundedRectangle(cornerRadius: size * 0.23)
                      .fill(LinearGradient(colors: [.indigo, .purple], startPoint: .topLeading, endPoint: .bottomTrailing))
                      .overlay(Image(systemName: "app.fill").font(.system(size: size * 0.38)).foregroundStyle(.white))
              }
          }

          struct ScreenTitle: View {
              let eyebrow: String
              let title: String
              var body: some View {
                  VStack(alignment: .leading, spacing: 5) {
                      Text(eyebrow.uppercased()).font(.caption2.weight(.bold)).tracking(1.6).foregroundStyle(.secondary)
                      Text(title).font(.system(size: 34, weight: .bold, design: .rounded)).tracking(-0.8)
                  }
              }
          }
          EOF_DDEGLASSSTORE_GLASSSTYLE_SWIFT
          mkdir -p $(dirname 'DDEGlassStore/App.swift')
          cat > 'DDEGlassStore/App.swift' <<'EOF_DDEGLASSSTORE_APP_SWIFT'
          import SwiftUI

          @main
          struct DDEGlassStoreApp: App {
              @StateObject private var store = StoreViewModel()

              var body: some Scene {
                  WindowGroup {
                      RootView()
                          .environmentObject(store)
                          .preferredColorScheme(store.colorScheme)
                  }
              }
          }
          EOF_DDEGLASSSTORE_APP_SWIFT
          mkdir -p $(dirname 'DDEGlassStore/Models.swift')
          cat > 'DDEGlassStore/Models.swift' <<'EOF_DDEGLASSSTORE_MODELS_SWIFT'
          import Foundation

          struct StoreApp: Identifiable, Hashable, Decodable {
              let trackId: Int
              let trackName: String
              let sellerName: String?
              let artistName: String?
              let description: String?
              let artworkUrl512: URL?
              let artworkUrl100: URL?
              let trackViewUrl: URL?
              let version: String?
              let averageUserRating: Double?
              let primaryGenreName: String?
              let fileSizeBytes: String?
              let formattedPrice: String?

              var id: Int { trackId }
              var developer: String { sellerName ?? artistName ?? "Unknown developer" }
              var subtitle: String { primaryGenreName ?? "App Store app" }
              var sizeText: String {
                  guard let fileSizeBytes, let bytes = Double(fileSizeBytes) else { return "—" }
                  return ByteCountFormatter.string(fromByteCount: Int64(bytes), countStyle: .file)
              }
              var ratingText: String {
                  guard let averageUserRating else { return "Not rated" }
                  return String(format: "%.1f ★", averageUserRating)
              }
              var priceText: String { formattedPrice ?? "View in App Store" }
          }

          struct SearchResponse: Decodable {
              let resultCount: Int
              let results: [StoreApp]
          }

          struct DownloadTaskItem: Identifiable {
              let id: Int
              let title: String
              var detail: String
              var isComplete: Bool
          }
          EOF_DDEGLASSSTORE_MODELS_SWIFT
          mkdir -p $(dirname 'DDEGlassStore/DiscoverView.swift')
          cat > 'DDEGlassStore/DiscoverView.swift' <<'EOF_DDEGLASSSTORE_DISCOVERVIEW_SWIFT'
          import SwiftUI

          struct DiscoverView: View {
              @EnvironmentObject private var store: StoreViewModel
              @State private var selected: StoreApp?

              var body: some View {
                  NavigationStack {
                      ScrollView(showsIndicators: false) {
                          VStack(alignment: .leading, spacing: 25) {
                              HStack {
                                  ScreenTitle(eyebrow: "A little something for you", title: "Discover")
                                  Spacer()
                                  Image(systemName: "person.crop.circle.fill").font(.system(size: 34)).foregroundStyle(.secondary)
                              }
                              if let feature = store.featuredApps.first {
                                  featureCard(feature)
                              } else if store.isLoading {
                                  ProgressView().frame(maxWidth: .infinity).padding(50)
                              }
                              HStack {
                                  Text("Popular discoveries").font(.title2.bold())
                                  Spacer()
                                  Button("See all") { store.selectedTab = 1 }.font(.subheadline.weight(.semibold))
                              }
                              if store.featuredApps.isEmpty && !store.isLoading {
                                  GlassCard { ContentUnavailableView("No featured apps", systemImage: "app.dashed",
                                                                     description: Text("Try Search to explore the App Store catalogue.")) }
                              }
                              ForEach(store.featuredApps.prefix(8)) { app in
                                  AppRow(app: app) { selected = app }
                              }
                              GlassCard {
                                  Label("Real App Store catalogue", systemImage: "checkmark.seal.fill")
                                      .font(.headline)
                                  Text("App names, artwork and product links are retrieved from Apple's public Search API. Installations happen through the official App Store.")
                                      .font(.caption).foregroundStyle(.secondary)
                              }
                          }.padding(.horizontal, 20).padding(.top, 18).padding(.bottom, 24)
                      }
                      .toolbar(.hidden, for: .navigationBar)
                      .sheet(item: $selected) { AppDetailView(app: $0) }
                  }
              }

              private func featureCard(_ app: StoreApp) -> some View {
                  Button { selected = app } label: {
                      ZStack(alignment: .bottomLeading) {
                          RoundedRectangle(cornerRadius: 30)
                              .fill(LinearGradient(colors: [.indigo, .purple, .blue],
                                                   startPoint: .topLeading, endPoint: .bottomTrailing))
                          Circle().fill(.white.opacity(0.10)).frame(width: 220).offset(x: 190, y: -65)
                          VStack(alignment: .leading, spacing: 12) {
                              Text("FEATURED DISCOVERY").font(.caption2.bold()).tracking(1.6).foregroundStyle(.white.opacity(0.8))
                              AppArtwork(app: app, size: 76)
                              Text(app.trackName).font(.largeTitle.bold()).foregroundStyle(.white).lineLimit(1)
                              Text(app.developer).font(.subheadline).foregroundStyle(.white.opacity(0.82))
                              HStack {
                                  Text("EXPLORE APP").font(.caption.bold()).tracking(1)
                                  Image(systemName: "arrow.up.right").font(.caption.bold())
                              }.foregroundStyle(.white)
                          }.padding(22)
                      }.frame(height: 285).clipShape(RoundedRectangle(cornerRadius: 30))
                  }.buttonStyle(.plain)
              }
          }

          struct AppRow: View {
              let app: StoreApp
              var action: () -> Void
              var body: some View {
                  Button(action: action) {
                      HStack(spacing: 13) {
                          AppArtwork(app: app, size: 62)
                          VStack(alignment: .leading, spacing: 4) {
                              Text(app.trackName).font(.headline).lineLimit(1)
                              Text(app.developer).font(.caption).foregroundStyle(.secondary).lineLimit(1)
                              Text(app.subtitle).font(.caption2).foregroundStyle(.tertiary)
                          }
                          Spacer(minLength: 4)
                          Text("VIEW").font(.caption.bold()).foregroundStyle(.blue)
                              .padding(.horizontal, 15).padding(.vertical, 8)
                              .background(.ultraThinMaterial, in: Capsule())
                      }
                      .padding(11)
                      .background(.ultraThinMaterial, in: RoundedRectangle(cornerRadius: 22, style: .continuous))
                      .overlay(RoundedRectangle(cornerRadius: 22).strokeBorder(.white.opacity(0.12)))
                  }.buttonStyle(.plain)
              }
          }
          EOF_DDEGLASSSTORE_DISCOVERVIEW_SWIFT
          mkdir -p $(dirname 'DDEGlassStore/ProfileView.swift')
          cat > 'DDEGlassStore/ProfileView.swift' <<'EOF_DDEGLASSSTORE_PROFILEVIEW_SWIFT'
          import SwiftUI

          enum AccentPalette {
              static let options: [(String, Color)] = [("Blue", .blue), ("Purple", .purple), ("Pink", .pink), ("Orange", .orange), ("Green", .green)]
              static func color(for name: String) -> Color {
                  options.first { $0.0.lowercased() == name.lowercased() }?.1 ?? .blue
              }
          }

          struct ProfileView: View {
              @EnvironmentObject private var store: StoreViewModel
              @AppStorage("dde_display_name") private var displayName: String = "Guest"
              @AppStorage("dde_avatar_color") private var avatarColor: String = "blue"
              @AppStorage("dde_accent") private var accentName: String = "blue"

              private var initials: String {
                  let parts = displayName.split(separator: " ")
                  let first = parts.first?.prefix(1) ?? "G"
                  let second = parts.count > 1 ? parts[1].prefix(1) : Substring("")
                  return (first + second).uppercased()
              }

              var body: some View {
                  NavigationStack {
                      Form {
                          Section {
                              HStack(spacing: 14) {
                                  Circle()
                                      .fill(LinearGradient(colors: [AccentPalette.color(for: avatarColor), AccentPalette.color(for: avatarColor).opacity(0.55)], startPoint: .topLeading, endPoint: .bottomTrailing))
                                      .frame(width: 54, height: 54)
                                      .overlay(Text(initials).font(.title3.bold()).foregroundStyle(.white))
                                      .overlay(Circle().strokeBorder(.white.opacity(0.4), lineWidth: 1))
                                  VStack(alignment: .leading, spacing: 2) {
                                      Text(displayName.isEmpty ? "Guest" : displayName).font(.headline)
                                      Text("Your saved app discoveries").font(.caption).foregroundStyle(.secondary)
                                  }
                              }.padding(.vertical, 6)
                          }
                          Section("Customize Profile") {
                              TextField("Display name", text: $displayName)
                              Picker("Avatar color", selection: $avatarColor) {
                                  ForEach(AccentPalette.options, id: \.0) { name, _ in
                                      Text(name).tag(name.lowercased())
                                  }
                              }
                          }
                          Section("Appearance") {
                              Picker("Theme", selection: Binding(
                                  get: { store.colorScheme == .light ? "Light" : store.colorScheme == .dark ? "Dark" : "System" },
                                  set: { store.colorScheme = $0 == "Light" ? .light : $0 == "Dark" ? .dark : nil }
                              )) {
                                  Text("System").tag("System")
                                  Text("Dark").tag("Dark")
                                  Text("Light").tag("Light")
                              }
                              Picker("Accent color", selection: $accentName) {
                                  ForEach(AccentPalette.options, id: \.0) { name, _ in
                                      Text(name).tag(name.lowercased())
                                  }
                              }
                          }
                          Section("About") {
                              LabeledContent("Version", value: "1.0 Starter")
                              LabeledContent("Catalogue", value: "Apple Search API")
                          }
                      }.navigationTitle("Profile")
                  }
              }
          }
          EOF_DDEGLASSSTORE_PROFILEVIEW_SWIFT
          mkdir -p $(dirname 'DDEGlassStore/DownloadsView.swift')
          cat > 'DDEGlassStore/DownloadsView.swift' <<'EOF_DDEGLASSSTORE_DOWNLOADSVIEW_SWIFT'
          import SwiftUI

          struct DownloadsView: View {
              @EnvironmentObject private var store: StoreViewModel
              var body: some View {
                  NavigationStack {
                      ScrollView {
                          VStack(alignment: .leading, spacing: 18) {
                              ScreenTitle(eyebrow: "Your activity", title: "Downloads")
                              GlassCard {
                                  Label("Install through the App Store", systemImage: "arrow.down.app.fill").font(.headline)
                                  Text("When you choose View in App Store on an app page, the official product page opens. Downloading and installation are handled by Apple's App Store.")
                                      .font(.caption).foregroundStyle(.secondary)
                              }
                              if store.tasks.isEmpty {
                                  ContentUnavailableView("Nothing here yet", systemImage: "arrow.down.circle",
                                                         description: Text("Your catalogue activity will appear here."))
                              } else {
                                  ForEach(store.tasks) { item in
                                      GlassCard {
                                          HStack {
                                              VStack(alignment: .leading, spacing: 5) {
                                                  Text(item.title).font(.headline)
                                                  Text(item.detail).font(.caption).foregroundStyle(.secondary)
                                              }
                                              Spacer()
                                              Image(systemName: "checkmark.circle.fill").foregroundStyle(.green)
                                          }
                                      }
                                  }
                              }
                          }.padding(20)
                      }
                  }
              }
          }
          EOF_DDEGLASSSTORE_DOWNLOADSVIEW_SWIFT
          mkdir -p $(dirname 'DDEGlassStore/StoreAPI.swift')
          cat > 'DDEGlassStore/StoreAPI.swift' <<'EOF_DDEGLASSSTORE_STOREAPI_SWIFT'
          import Foundation

          enum StoreAPIError: LocalizedError {
              case invalidResponse
              case noResults
              var errorDescription: String? {
                  switch self {
                  case .invalidResponse: return "The App Store response could not be read."
                  case .noResults: return "No matching apps were found."
                  }
              }
          }

          /// Apple's public iTunes Search API returns App Store metadata and product-page links.
          /// It does not return IPA files and cannot install apps.
          struct StoreAPI {
              func searchApps(term: String, limit: Int = 30) async throws -> [StoreApp] {
                  var components = URLComponents(string: "https://itunes.apple.com/search")!
                  components.queryItems = [
                      URLQueryItem(name: "term", value: term),
                      URLQueryItem(name: "entity", value: "software"),
                      URLQueryItem(name: "country", value: "in"),
                      URLQueryItem(name: "limit", value: String(limit))
                  ]
                  guard let url = components.url else { throw StoreAPIError.invalidResponse }
                  var request = URLRequest(url: url)
                  request.timeoutInterval = 20
                  request.setValue("application/json", forHTTPHeaderField: "Accept")
                  let (data, response) = try await URLSession.shared.data(for: request)
                  guard let http = response as? HTTPURLResponse, (200..<300).contains(http.statusCode) else {
                      throw StoreAPIError.invalidResponse
                  }
                  let decoded = try JSONDecoder().decode(SearchResponse.self, from: data)
                  return decoded.results
              }
          }
          EOF_DDEGLASSSTORE_STOREAPI_SWIFT
          mkdir -p $(dirname 'DDEGlassStore/RootView.swift')
          cat > 'DDEGlassStore/RootView.swift' <<'EOF_DDEGLASSSTORE_ROOTVIEW_SWIFT'
          import SwiftUI

          struct RootView: View {
              @EnvironmentObject private var store: StoreViewModel
              @Namespace private var tabNS
              @AppStorage("dde_accent") private var accentName: String = "blue"

              var body: some View {
                  ZStack(alignment: .bottom) {
                      background
                      Group {
                          switch store.selectedTab {
                          case 1: AppsView()
                          case 2: SearchView()
                          case 3: DownloadsView()
                          case 4: ProfileView()
                          default: DiscoverView()
                          }
                      }
                      .id(store.selectedTab)
                      .transition(.opacity.combined(with: .move(edge: .bottom)))
                      .safeAreaInset(edge: .bottom) { Color.clear.frame(height: 90) }
                      tabBar
                  }
                  .task { await store.loadFeatured() }
                  .tint(AccentPalette.color(for: accentName))
              }

              private var background: some View {
                  ZStack {
                      Color(uiColor: .systemBackground)
                      RadialGradient(colors: [.blue.opacity(0.16), .clear],
                                     center: .topTrailing, startRadius: 10, endRadius: 440)
                      RadialGradient(colors: [.purple.opacity(0.11), .clear],
                                     center: .bottomLeading, startRadius: 5, endRadius: 380)
                  }.ignoresSafeArea()
              }

              private var tabBar: some View {
                  HStack(spacing: 12) {
                      HStack(spacing: 2) {
                          tab("Today", "sparkles", 0)
                          tab("Apps", "square.grid.2x2.fill", 1)
                          tab("Downloads", "arrow.down.circle", 3)
                          tab("Profile", "person.crop.circle", 4)
                      }
                      .padding(.horizontal, 8).padding(.vertical, 8)
                      .background {
                          if #available(iOS 26.0, *) {
                              Capsule().fill(.clear).glassEffect(.regular, in: Capsule())
                          } else {
                              Capsule().fill(.regularMaterial)
                          }
                      }
                      .overlay(Capsule().strokeBorder(.white.opacity(0.24), lineWidth: 1))
                      .shadow(color: .black.opacity(0.18), radius: 24, y: 10)
                      searchButton
                  }
                  .padding(.horizontal, 16).padding(.bottom, 7)
              }

              private var searchButton: some View {
                  Button {
                      withAnimation(.spring(response: 0.42, dampingFraction: 0.78)) {
                          store.selectedTab = 2
                      }
                  } label: {
                      Image(systemName: "magnifyingglass")
                          .font(.system(size: 19, weight: .semibold))
                          .symbolEffect(.bounce, value: store.selectedTab == 2)
                          .foregroundStyle(store.selectedTab == 2 ? Color.accentColor : Color.primary)
                          .frame(width: 52, height: 52)
                          .background { searchCircleGlass }
                          .contentShape(Circle())
                  }
                  .buttonStyle(.plain)
              }

              @ViewBuilder private var searchCircleGlass: some View {
                  if #available(iOS 26.0, *) {
                      if store.selectedTab == 2 {
                          Circle()
                              .fill(.clear)
                              .glassEffect(.regular.tint(.accentColor.opacity(0.22)).interactive(), in: Circle())
                              .overlay(Circle().strokeBorder(.white.opacity(0.35), lineWidth: 1))
                              .shadow(color: .black.opacity(0.18), radius: 24, y: 10)
                      } else {
                          Circle()
                              .fill(.clear)
                              .glassEffect(.regular, in: Circle())
                              .overlay(Circle().strokeBorder(.white.opacity(0.24), lineWidth: 1))
                              .shadow(color: .black.opacity(0.18), radius: 24, y: 10)
                      }
                  } else {
                      Circle()
                          .fill(store.selectedTab == 2 ? AnyShapeStyle(Color.accentColor.opacity(0.18)) : AnyShapeStyle(.regularMaterial))
                          .overlay(Circle().strokeBorder(.white.opacity(0.24), lineWidth: 1))
                          .shadow(color: .black.opacity(0.18), radius: 24, y: 10)
                  }
              }

              private func tab(_ title: String, _ symbol: String, _ index: Int) -> some View {
                  Button {
                      withAnimation(.spring(response: 0.42, dampingFraction: 0.78)) {
                          store.selectedTab = index
                      }
                  } label: {
                      VStack(spacing: 4) {
                          Image(systemName: symbol).font(.system(size: 18, weight: .semibold))
                              .symbolEffect(.bounce, value: store.selectedTab == index)
                          Text(title).font(.system(size: 9, weight: .semibold))
                      }
                      .foregroundStyle(store.selectedTab == index ? Color.accentColor : Color.secondary)
                      .frame(maxWidth: .infinity).padding(.vertical, 6)
                      .background {
                          if store.selectedTab == index { selectedPill }
                      }
                      .contentShape(Rectangle())
                  }
                  .buttonStyle(.plain)
              }

              @ViewBuilder private var selectedPill: some View {
                  if #available(iOS 26.0, *) {
                      Capsule()
                          .fill(.white.opacity(0.16))
                          .glassEffect(.regular.tint(.accentColor.opacity(0.18)).interactive(), in: Capsule())
                          .overlay(Capsule().strokeBorder(.white.opacity(0.45), lineWidth: 1))
                          .shadow(color: .white.opacity(0.25), radius: 8)
                          .matchedGeometryEffect(id: "tabPill", in: tabNS)
                  } else {
                      Capsule()
                          .fill(Color.accentColor.opacity(0.15))
                          .overlay(Capsule().strokeBorder(Color.accentColor.opacity(0.3), lineWidth: 1))
                          .matchedGeometryEffect(id: "tabPill", in: tabNS)
                  }
              }
          }
          EOF_DDEGLASSSTORE_ROOTVIEW_SWIFT
          mkdir -p $(dirname 'DDEGlassStore/AppDetailView.swift')
          cat > 'DDEGlassStore/AppDetailView.swift' <<'EOF_DDEGLASSSTORE_APPDETAILVIEW_SWIFT'
          import SwiftUI

          struct AppDetailView: View {
              @EnvironmentObject private var store: StoreViewModel
              @Environment(\.dismiss) private var dismiss
              let app: StoreApp

              var body: some View {
                  NavigationStack {
                      ScrollView {
                          VStack(alignment: .leading, spacing: 22) {
                              HStack(alignment: .top, spacing: 16) {
