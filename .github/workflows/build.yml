              var body: some View {
                  NavigationStack {
                      ScrollView {
                          VStack(alignment: .leading, spacing: 20) {
                              NavigationLink(destination: CollectionView(title: "New in DDE Glass", apps: catalogue.filter { $0.featured })) {
                                  FeatureCard(eyebrow: "NOW TRENDING", title: "See what is new in DDE Glass", subtitle: "A gorgeous liquid glass design - more personal, expressive and delightful.", colors: [.teal, .blue], icon: "sparkles")
                              }
                              .buttonStyle(.plain)
                              NavigationLink(destination: AppDetailView(app: appOfDay)) {
                                  AppOfDayCard(app: appOfDay)
                              }
                              .buttonStyle(.plain)
                              Text("Our Favourites").font(.title3.bold()).padding(.horizontal)
                              VStack(spacing: 2) {
                                  ForEach(catalogue.prefix(4)) { app in
                                      FavouriteRow(app: app)
                                  }
