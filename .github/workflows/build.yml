                              Spacer()
                              Text(toast)
                                  .font(.subheadline.bold())
                                  .padding(.horizontal, 20)
                                  .padding(.vertical, 12)
                                  .background(.ultraThinMaterial)
                                  .cornerRadius(24)
                                  .overlay(Capsule().stroke(.white.opacity(0.4), lineWidth: 1))
                                  .shadow(radius: 8)
                                  .padding(.bottom, 96)
                          }
