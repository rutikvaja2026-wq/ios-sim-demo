          cat > 'DDEGlassStore/StoreViewModel.swift' <<'EOF_DDEGLASSSTORE_STOREVIEWMODEL_SWIFT'
          import SwiftUI

          @MainActor
          final class StoreViewModel: ObservableObject {
              @Published var selectedTab = 0
              @Published var searchText = ""
              @Published var apps: [StoreApp] = []
              @Published var featuredApps: [StoreApp] = []
              @Published var savedIDs: Set<Int> = []
              @Published var tasks: [DownloadTaskItem] = []
              @Published var isLoading = false
              @Published var errorMessage: String?
              @Published var colorScheme: ColorScheme? = .dark

              private let api = StoreAPI()
              private var searchTask: Task<Void, Never>?

              func loadFeatured() async {
                  guard featuredApps.isEmpty else { return }
                  await performSearch("photo editor", intoFeatured: true)
              }

              func search(_ term: String) {
                  searchTask?.cancel()
                  guard !term.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty else {
                      apps = []
                      errorMessage = nil
                      return
                  }
                  searchTask = Task { await performSearch(term, intoFeatured: false) }
              }

              private func performSearch(_ term: String, intoFeatured: Bool) async {
                  isLoading = true
                  errorMessage = nil
                  do {
                      let results = try await api.searchApps(term: term)
                      if intoFeatured { featuredApps = results }
                      else { apps = results }
                  } catch {
                      if !Task.isCancelled { errorMessage = error.localizedDescription }
                  }
                  isLoading = false
              }

              func toggleSaved(_ app: StoreApp) {
                  if savedIDs.contains(app.id) { savedIDs.remove(app.id) }
                  else { savedIDs.insert(app.id) }
              }

              func addMetadataTask(for app: StoreApp) {
                  guard !tasks.contains(where: { $0.id == app.id }) else { return }
                  tasks.insert(DownloadTaskItem(id: app.id, title: app.trackName,
                                                detail: "Opening official App Store listing is required for installation.",
                                                isComplete: true), at: 0)
              }

              func openOfficialListing(for app: StoreApp) {
                  guard let url = app.trackViewUrl else { return }
                  UIApplication.shared.open(url)
              }
          }
          EOF_DDEGLASSSTORE_STOREVIEWMODEL_SWIFT
