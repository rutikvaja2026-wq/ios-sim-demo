                                  }
                                  .foregroundColor(tab == i ? .white : .primary.opacity(0.75))
                                  .frame(maxWidth: .infinity)
                                  .padding(.vertical, 9)
                                  .background {
                                      if tab == i {
                                          Capsule()
                                              .fill(LinearGradient(colors: [Color(red: 0.25, green: 0.6, blue: 1.0), Color(red: 0.05, green: 0.4, blue: 0.9)], startPoint: .top, endPoint: .bottom))
                                              .matchedGeometryEffect(id: "sel", in: ns)
                                              .overlay(Capsule().stroke(.white.opacity(0.5), lineWidth: 1))
                                              .shadow(color: .blue.opacity(0.45), radius: 8, y: 2)
                                      }
                                  }
                              }
                              .buttonStyle(.plain)
                          }
                      }
                      .padding(4)
                      .background(.ultraThinMaterial)
                      .clipShape(Capsule())
                      .overlay(Capsule().stroke(.white.opacity(0.4), lineWidth: 1))
                      .shadow(color: .black.opacity(0.15), radius: 12, y: 4)
                      Button(action: onSearch) {
                          Image(systemName: "magnifyingglass")
                              .font(.system(size: 20, weight: .semibold))
                              .foregroundColor(.primary.opacity(0.85))
                              .frame(width: 54, height: 54)
                              .background(.ultraThinMaterial)
                              .clipShape(Circle())
                              .overlay(Circle().stroke(.white.opacity(0.4), lineWidth: 1))
                              .shadow(color: .black.opacity(0.15), radius: 12, y: 4)
