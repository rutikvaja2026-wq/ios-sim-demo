name: Build iOS Simulator App
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Write project files
        run: |
          mkdir -p $(dirname 'DDEGlassStore/AppsAndSearchViews.swift')
          cat > 'DDEGlassStore/AppsAndSearchViews.swift' <<'EOF_DDEGLASSSTORE_APPSANDSEARCHVIEWS_SWIFT'
          import SwiftUI

          struct AppsView: View {
              @EnvironmentObject private var store: StoreViewModel
              @State private var selectedApp: StoreApp?

              var body: some View {
                  NavigationStack {
                      ScrollView {
                          VStack(alignment: .leading, spacing: 18) {
                              Text("Apps").font(.largeTitle.bold())
                              categoryPicker
                              ForEach(store.filteredApps) { app in
                                  AppRow(app: app) { selectedApp = app }
                              }
                          }.padding(20)
                      }
                      .sheet(item: $selectedApp) { AppDetailView(app: $0) }
                  }
              }

              private var categoryPicker: some View {
                  ScrollView(.horizontal, showsIndicators: false) {
                      HStack {
                          ForEach(store.categories, id: \.self) { category in
                              Button {
                                  store.selectedCategory = category
                              } label: {
                                  Text(category).font(.subheadline.weight(.semibold))
                                      .padding(.horizontal, 14).padding(.vertical, 9)
                                      .background(store.selectedCategory == category ? Color.primary.opacity(0.13) : Color.clear,
                                                  in: Capsule())
                                      .overlay(Capsule().strokeBorder(.primary.opacity(0.1)))
                              }.buttonStyle(.plain)
                          }
                      }
                  }
              }
          }

          struct SearchView: View {
              @EnvironmentObject private var store: StoreViewModel
              @State private var selectedApp: StoreApp?

              var body: some View {
                  NavigationStack {
                      ScrollView {
                          VStack(alignment: .leading, spacing: 18) {
                              Text("Search").font(.largeTitle.bold())
                              HStack {
                                  Image(systemName: "magnifyingglass").foregroundStyle(.secondary)
                                  TextField("Apps, games and more", text: $store.searchText)
                                      .autocorrectionDisabled()
                                  if !store.searchText.isEmpty {
                                      Button { store.searchText = "" } label: {
                                          Image(systemName: "xmark.circle.fill").foregroundStyle(.secondary)
                                      }
                                  }
                              }
                              .padding(14).background(.ultraThinMaterial, in: RoundedRectangle(cornerRadius: 16))
                              ForEach(store.filteredApps) { app in
                                  AppRow(app: app) { selectedApp = app }
                              }
                              if store.filteredApps.isEmpty {
                                  ContentUnavailableView.search(text: store.searchText)
                              }
                          }.padding(20)
                      }
                      .sheet(item: $selectedApp) { AppDetailView(app: $0) }
                  }
              }
          }
          EOF_DDEGLASSSTORE_APPSANDSEARCHVIEWS_SWIFT
          mkdir -p $(dirname 'DDEGlassStore/GlassStyle.swift')
          cat > 'DDEGlassStore/GlassStyle.swift' <<'EOF_DDEGLASSSTORE_GLASSSTYLE_SWIFT'
          import SwiftUI

          struct GlassPanel<Content: View>: View {
              var padding: CGFloat = 16
              @ViewBuilder var content: Content

              var body: some View {
                  content
                      .padding(padding)
                      .background(.ultraThinMaterial, in: RoundedRectangle(cornerRadius: 24, style: .continuous))
                      .overlay {
                          RoundedRectangle(cornerRadius: 24, style: .continuous)
                              .strokeBorder(.white.opacity(0.12), lineWidth: 1)
                      }
              }
          }

          struct AppIconView: View {
              let app: StoreApp
              var size: CGFloat = 58

              var body: some View {
                  RoundedRectangle(cornerRadius: size * 0.25, style: .continuous)
                      .fill(LinearGradient(colors: [app.tint.opacity(0.95), app.tint.opacity(0.55)],
                                           startPoint: .topLeading, endPoint: .bottomTrailing))
                      .overlay {
                          Image(systemName: app.symbol)
                              .font(.system(size: size * 0.42, weight: .semibold))
                              .foregroundStyle(.white)
                      }
                      .frame(width: size, height: size)
                      .shadow(color: app.tint.opacity(0.22), radius: 12, y: 6)
              }
          }

          struct SectionHeading: View {
              let title: String
              var trailing: String? = nil

              var body: some View {
                  HStack {
                      Text(title).font(.title2.bold())
                      Spacer()
                      if let trailing {
                          Text(trailing).font(.subheadline.weight(.semibold)).foregroundStyle(.secondary)
                      }
                  }
              }
          }
          EOF_DDEGLASSSTORE_GLASSSTYLE_SWIFT
          mkdir -p $(dirname 'DDEGlassStore/App.swift')
          cat > 'DDEGlassStore/App.swift' <<'EOF_DDEGLASSSTORE_APP_SWIFT'
          import SwiftUI

          @main
          struct DDEGlassStoreApp: App {
              @StateObject private var store = StoreViewModel()

              var body: some Scene {
                  WindowGroup {
                      RootView()
                          .environmentObject(store)
                          .preferredColorScheme(store.colorScheme)
                  }
              }
          }
          EOF_DDEGLASSSTORE_APP_SWIFT
          mkdir -p $(dirname 'DDEGlassStore/Models.swift')
          cat > 'DDEGlassStore/Models.swift' <<'EOF_DDEGLASSSTORE_MODELS_SWIFT'
          import SwiftUI

          struct StoreApp: Identifiable, Hashable {
              let id: String
              let name: String
              let developer: String
              let subtitle: String
              let description: String
              let category: String
              let version: String
              let size: String
              let symbol: String
              let tint: Color
              var isFeatured: Bool = false
          }

          enum DownloadState: Equatable {
              case notStarted, downloading, complete
          }

          struct DownloadItem: Identifiable {
              let id: String
              let appName: String
              var progress: Double
              var state: DownloadState
          }
          EOF_DDEGLASSSTORE_MODELS_SWIFT
          mkdir -p $(dirname 'DDEGlassStore/DiscoverView.swift')
          cat > 'DDEGlassStore/DiscoverView.swift' <<'EOF_DDEGLASSSTORE_DISCOVERVIEW_SWIFT'
          import SwiftUI

          struct DiscoverView: View {
              @EnvironmentObject private var store: StoreViewModel
              @State private var selectedApp: StoreApp?

              var body: some View {
                  NavigationStack {
                      ScrollView(showsIndicators: false) {
                          VStack(alignment: .leading, spacing: 26) {
                              header
                              if let featured = store.apps.first(where: \.isFeatured) {
                                  featuredCard(featured)
                              }
                              VStack(alignment: .leading, spacing: 14) {
                                  SectionHeading(title: "Popular right now", trailing: "See all")
                                  ForEach(store.apps.filter { !$0.isFeatured }) { app in
                                      AppRow(app: app) { selectedApp = app }
                                  }
                              }
                              VStack(alignment: .leading, spacing: 14) {
                                  SectionHeading(title: "Explore categories")
                                  ScrollView(.horizontal, showsIndicators: false) {
                                      HStack {
                                          ForEach(store.categories.filter { $0 != "All" }, id: \.self) { category in
                                              Button {
                                                  store.selectedCategory = category
                                                  store.selectedTab = 1
                                              } label: {
                                                  Text(category).font(.subheadline.weight(.semibold))
                                                      .padding(.horizontal, 16).padding(.vertical, 11)
                                                      .background(.ultraThinMaterial, in: Capsule())
                                              }.buttonStyle(.plain)
                                          }
                                      }
                                  }
                              }
                          }
                          .padding(.horizontal, 20)
                          .padding(.top, 16)
                          .padding(.bottom, 24)
                      }
                      .toolbar(.hidden, for: .navigationBar)
                      .sheet(item: $selectedApp) { AppDetailView(app: $0) }
                  }
              }

              private var header: some View {
                  HStack(alignment: .center) {
                      VStack(alignment: .leading, spacing: 4) {
                          Text("FRIDAY, NOVEMBER 6").font(.caption2.weight(.bold)).tracking(1.3).foregroundStyle(.secondary)
                          Text("Discover").font(.largeTitle.bold())
                      }
                      Spacer()
                      Image(systemName: "person.crop.circle.fill")
                          .font(.system(size: 34)).foregroundStyle(.secondary)
                  }
              }

              private func featuredCard(_ app: StoreApp) -> some View {
                  Button { selectedApp = app } label: {
                      ZStack(alignment: .bottomLeading) {
                          RoundedRectangle(cornerRadius: 30).fill(
                              LinearGradient(colors: [.indigo, .purple, .blue.opacity(0.8)],
                                             startPoint: .topLeading, endPoint: .bottomTrailing))
                          Circle().fill(.white.opacity(0.12)).frame(width: 190).offset(x: 210, y: -55)
                          VStack(alignment: .leading, spacing: 12) {
                              Text("EDITOR'S FEATURE").font(.caption2.bold()).tracking(1.5).foregroundStyle(.white.opacity(0.8))
                              AppIconView(app: app, size: 66)
                              Text(app.name).font(.title.bold()).foregroundStyle(.white)
                              Text(app.subtitle).font(.subheadline).foregroundStyle(.white.opacity(0.85))
                              Text("EXPLORE  →").font(.caption.bold()).tracking(1).foregroundStyle(.white)
                          }.padding(22)
                      }
                      .frame(height: 260).clipShape(RoundedRectangle(cornerRadius: 30))
                  }.buttonStyle(.plain)
              }
          }

          struct AppRow: View {
              @EnvironmentObject private var store: StoreViewModel
              let app: StoreApp
              var action: () -> Void

              var body: some View {
                  HStack(spacing: 13) {
                      AppIconView(app: app)
                      VStack(alignment: .leading, spacing: 4) {
                          Text(app.name).font(.headline)
                          Text(app.subtitle).font(.caption).foregroundStyle(.secondary).lineLimit(1)
                          Text(app.category.uppercased()).font(.system(size: 9, weight: .bold)).tracking(0.8).foregroundStyle(.tertiary)
                      }
                      Spacer()
                      Button("GET") { store.startDemoDownload(for: app) }
                          .font(.caption.bold()).foregroundStyle(.blue)
                          .padding(.horizontal, 17).padding(.vertical, 8)
                          .background(.quaternary, in: Capsule())
                      Button(action: action) {
                          Image(systemName: "chevron.right").font(.caption.bold()).foregroundStyle(.tertiary)
                      }
                  }
                  .padding(12)
                  .background(.ultraThinMaterial, in: RoundedRectangle(cornerRadius: 20))
              }
          }
          EOF_DDEGLASSSTORE_DISCOVERVIEW_SWIFT
          mkdir -p $(dirname 'DDEGlassStore/DownloadsView.swift')
          cat > 'DDEGlassStore/DownloadsView.swift' <<'EOF_DDEGLASSSTORE_DOWNLOADSVIEW_SWIFT'
          import SwiftUI

          struct DownloadsView: View {
              @EnvironmentObject private var store: StoreViewModel

              var body: some View {
                  NavigationStack {
                      ScrollView {
                          VStack(alignment: .leading, spacing: 18) {
                              Text("Downloads").font(.largeTitle.bold())
                              GlassPanel {
                                  Label("Demo download manager", systemImage: "arrow.down.circle")
                                      .font(.headline)
                                  Text("Progress shown here is a UI demonstration. No third-party app files are downloaded or installed.")
                                      .font(.caption).foregroundStyle(.secondary)
                              }
                              if store.downloads.isEmpty {
                                  ContentUnavailableView("No Downloads", systemImage: "arrow.down.circle",
                                                         description: Text("Apps you add from the catalogue will appear here."))
                              } else {
                                  ForEach(store.downloads) { item in
                                      VStack(alignment: .leading, spacing: 10) {
                                          HStack {
                                              Text(item.appName).font(.headline)
                                              Spacer()
                                              Text(item.state == .complete ? "Done" : "\(Int(item.progress * 100))%")
                                                  .font(.caption.weight(.semibold)).foregroundStyle(.secondary)
                                          }
                                          ProgressView(value: item.progress)
                                      }.padding(15).background(.ultraThinMaterial, in: RoundedRectangle(cornerRadius: 18))
                                  }
                              }
                          }.padding(20)
                      }
                  }
              }
          }
          EOF_DDEGLASSSTORE_DOWNLOADSVIEW_SWIFT
          mkdir -p $(dirname 'DDEGlassStore/RootView.swift')
          cat > 'DDEGlassStore/RootView.swift' <<'EOF_DDEGLASSSTORE_ROOTVIEW_SWIFT'
          import SwiftUI

          struct RootView: View {
              @EnvironmentObject private var store: StoreViewModel

              var body: some View {
                  ZStack(alignment: .bottom) {
                      LinearGradient(colors: [Color(uiColor: .systemBackground),
                                              Color.indigo.opacity(0.08),
                                              Color(uiColor: .systemBackground)],
                                     startPoint: .topLeading, endPoint: .bottomTrailing)
                          .ignoresSafeArea()

                      Group {
                          switch store.selectedTab {
                          case 1: AppsView()
                          case 2: SearchView()
                          case 3: DownloadsView()
                          default: DiscoverView()
                          }
                      }
                      .safeAreaInset(edge: .bottom) { Color.clear.frame(height: 82) }

                      tabBar
                  }
                  .tint(.primary)
              }

              private var tabBar: some View {
                  HStack(spacing: 0) {
                      tab("Discover", icon: "sparkles", index: 0)
                      tab("Apps", icon: "square.grid.2x2", index: 1)
                      tab("Search", icon: "magnifyingglass", index: 2)
                      tab("Downloads", icon: "arrow.down.circle", index: 3)
                  }
                  .padding(.vertical, 12)
                  .background(.ultraThinMaterial, in: Capsule())
                  .overlay(Capsule().strokeBorder(.white.opacity(0.16), lineWidth: 1))
                  .shadow(color: .black.opacity(0.16), radius: 22, y: 8)
                  .padding(.horizontal, 22)
                  .padding(.bottom, 8)
              }

              private func tab(_ title: String, icon: String, index: Int) -> some View {
                  Button {
                      withAnimation(.spring(response: 0.36, dampingFraction: 0.82)) {
                          store.selectedTab = index
                      }
                  } label: {
                      VStack(spacing: 5) {
                          Image(systemName: icon).font(.system(size: 19, weight: .semibold))
                          Text(title).font(.system(size: 10, weight: .semibold))
                      }
                      .foregroundStyle(store.selectedTab == index ? Color.primary : Color.secondary)
                      .frame(maxWidth: .infinity)
                      .contentShape(Rectangle())
                  }
                  .buttonStyle(.plain)
              }
          }
          EOF_DDEGLASSSTORE_ROOTVIEW_SWIFT
          mkdir -p $(dirname 'DDEGlassStore/AppDetailView.swift')
          cat > 'DDEGlassStore/AppDetailView.swift' <<'EOF_DDEGLASSSTORE_APPDETAILVIEW_SWIFT'
          import SwiftUI

          struct AppDetailView: View {
              @EnvironmentObject private var store: StoreViewModel
              @Environment(\.dismiss) private var dismiss
              let app: StoreApp

              var body: some View {
                  NavigationStack {
                      ScrollView {
                          VStack(alignment: .leading, spacing: 22) {
                              HStack(spacing: 16) {
                                  AppIconView(app: app, size: 88)
                                  VStack(alignment: .leading, spacing: 6) {
                                      Text(app.name).font(.title2.bold())
                                      Text(app.developer).font(.subheadline).foregroundStyle(.secondary)
                                      Text(app.subtitle).font(.caption).foregroundStyle(.secondary)
                                  }
                              }
                              HStack {
                                  Button {
                                      store.startDemoDownload(for: app)
                                  } label: {
                                      Text(store.library.contains(app.id) ? "Added" : "GET")
                                          .font(.headline).frame(maxWidth: .infinity).padding(.vertical, 12)
                                          .background(Color.blue, in: Capsule()).foregroundStyle(.white)
                                  }
                                  Button { } label: {
                                      Image(systemName: "square.and.arrow.up")
                                          .font(.headline).padding(12).background(.quaternary, in: Circle())
                                  }
                              }
                              HStack(spacing: 0) {
                                  metadata("VERSION", app.version)
                                  metadata("SIZE", app.size)
                                  metadata("CATEGORY", app.category)
                              }
                              Divider()
                              VStack(alignment: .leading, spacing: 8) {
                                  Text("About this app").font(.title3.bold())
                                  Text(app.description).foregroundStyle(.secondary)
                              }
                              GlassPanel {
                                  Label("Demo catalogue item", systemImage: "info.circle")
                                      .font(.subheadline.weight(.semibold))
                                  Text("GET adds this sample entry to the demo library. It does not install an iOS application.")
                                      .font(.caption).foregroundStyle(.secondary)
                              }
                          }.padding(22)
                      }
                      .navigationTitle(app.name)
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .topBarTrailing) {
                              Button("Done") { dismiss() }
                          }
                      }
                  }
              }

              private func metadata(_ title: String, _ value: String) -> some View {
                  VStack(spacing: 5) {
                      Text(title).font(.system(size: 9, weight: .bold)).foregroundStyle(.secondary)
                      Text(value).font(.caption.weight(.semibold)).lineLimit(1)
                  }.frame(maxWidth: .infinity)
              }
          }
          EOF_DDEGLASSSTORE_APPDETAILVIEW_SWIFT
          mkdir -p $(dirname 'DDEGlassStore/StoreViewModel.swift')
          cat > 'DDEGlassStore/StoreViewModel.swift' <<'EOF_DDEGLASSSTORE_STOREVIEWMODEL_SWIFT'
          import SwiftUI

          @MainActor
          final class StoreViewModel: ObservableObject {
              @Published var selectedTab = 0
              @Published var searchText = ""
              @Published var selectedCategory = "All"
              @Published var downloads: [DownloadItem] = []
              @Published var library: Set<String> = []
              @Published var colorScheme: ColorScheme? = .dark

              let categories = ["All", "Productivity", "Utilities", "Creativity", "Lifestyle", "Games"]

              let apps: [StoreApp] = [
                  StoreApp(id: "orbit", name: "Orbit Notes", developer: "Northstar Studio",
                           subtitle: "A calmer space for your ideas",
                           description: "Capture thoughts, organize projects and keep everyday ideas in one beautifully simple place.",
                           category: "Productivity", version: "2.4.0", size: "42 MB",
                           symbol: "note.text", tint: .indigo, isFeatured: true),
                  StoreApp(id: "luma", name: "Luma Weather", developer: "Daylight Labs",
                           subtitle: "Weather, with a little clarity",
                           description: "A clean weather experience with daily forecasts and useful conditions at a glance.",
                           category: "Utilities", version: "1.8.2", size: "28 MB",
                           symbol: "sun.max.fill", tint: .orange),
                  StoreApp(id: "frame", name: "Frame Studio", developer: "Pixel Foundry",
                           subtitle: "Make every moment yours",
                           description: "A sample creative toolkit for collecting inspiration and arranging visual ideas.",
                           category: "Creativity", version: "3.1.0", size: "86 MB",
                           symbol: "square.stack.3d.up.fill", tint: .pink),
                  StoreApp(id: "tempo", name: "Tempo", developer: "Good Habit Co.",
                           subtitle: "Small steps, steady days",
                           description: "A lightweight habit companion with gentle reminders and simple progress views.",
                           category: "Lifestyle", version: "1.2.1", size: "19 MB",
                           symbol: "circle.grid.2x2.fill", tint: .mint),
                  StoreApp(id: "monument", name: "Monument Valley", developer: "Demo Listing",
                           subtitle: "A featured puzzle-game listing",
                           description: "A sample catalogue entry for demonstrating the app detail layout. This is not a download listing.",
                           category: "Games", version: "Demo", size: "—",
                           symbol: "cube.fill", tint: .purple)
              ]

              var filteredApps: [StoreApp] {
                  apps.filter { app in
                      let categoryMatch = selectedCategory == "All" || app.category == selectedCategory
                      let queryMatch = searchText.isEmpty ||
                          app.name.localizedCaseInsensitiveContains(searchText) ||
                          app.developer.localizedCaseInsensitiveContains(searchText) ||
                          app.category.localizedCaseInsensitiveContains(searchText)
                      return categoryMatch && queryMatch
                  }
              }

              func startDemoDownload(for app: StoreApp) {
                  guard !downloads.contains(where: { $0.id == app.id }) else { return }
                  downloads.insert(DownloadItem(id: app.id, appName: app.name,
                                                progress: 0, state: .downloading), at: 0)
                  library.insert(app.id)
                  guard let index = downloads.firstIndex(where: { $0.id == app.id }) else { return }
                  // A short UI demonstration only; no file is downloaded.
                  Task {
                      for step in 1...20 {
                          try? await Task.sleep(for: .milliseconds(90))
                          guard downloads.indices.contains(index) else { return }
                          downloads[index].progress = Double(step) / 20
                      }
                      if downloads.indices.contains(index) {
                          downloads[index].state = .complete
                      }
                  }
              }
          }
          EOF_DDEGLASSSTORE_STOREVIEWMODEL_SWIFT
          mkdir -p $(dirname 'DDEGlassStore.xcodeproj/project.pbxproj')
          cat > 'DDEGlassStore.xcodeproj/project.pbxproj' <<'EOF_DDEGLASSSTORE_XCODEPROJ_PROJECT_PBXPROJ'
