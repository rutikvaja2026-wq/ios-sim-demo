          mkdir -p $(dirname 'README.md')
          cat > 'README.md' <<'EOF_README_MD'
          # DDE Glass Store — iOS Simulator Starter

          A SwiftUI starter project for an original app-store-style interface inspired by modern iOS design.
          It is not the proprietary DDE Store application and does not contain its private assets or catalogue.

          ## Open
          1. Extract this ZIP on a Mac.
          2. Open `DDEGlassStore.xcodeproj` in Xcode.
          3. Select an iPhone Simulator (iOS 17 or later).
          4. Build and Run.

          ## Appetize.io
          Appetize requires a compiled iOS Simulator `.app` bundle, usually uploaded as a ZIP.
          This source project is **not itself** a compiled `.app`. Build it in Xcode first:
          - Product > Build
          - In Xcode's Products group, locate `DDEGlassStore.app`
          - Use the Simulator build (not an iPhone device/archive build)
          - Zip the `.app` bundle and upload that ZIP to Appetize.

          ## Current functionality
          - Discover screen with featured and curated demo apps
          - Search and category filtering
          - App detail sheet
          - Demo download queue (clearly marked as simulated)
          - Library and settings screens
          - Dark/light appearance preference

          ## Important
          The catalogue uses sample data and placeholder artwork. It does not download or install third-party apps.
