          struct AppListRow: View {
              let app: StoreApp
              var actionLabel: String = "Install"
              var buildNumber: Int { (app.name.count * 137 + app.version.count * 91) % 900 + 100 }
              var expiryDays: Int { 55 + (app.name.count * 3) % 35 }
              var body: some View {
                  NavigationLink(destination: AppDetailView(app: app)) {
                      HStack(spacing: 12) {
                          AppIcon(app: app, size: 48)
                          VStack(alignment: .leading, spacing: 2) {
                              Text(app.name).font(.headline).lineLimit(1)
                              Text("Version \(app.version) (\(buildNumber))").font(.caption).foregroundColor(.secondary)
                              Text("Demo slot - expires in \(expiryDays) days").font(.caption).foregroundColor(.secondary)
                          }
                          Spacer()
                          InstallPill(app: app, label: actionLabel)
                      }
                      .padding(.vertical, 6)
                  }
                  .buttonStyle(.plain)
              }
          }

          struct AppsView: View {
              @State private var showProfile = false
              var updatable: [StoreApp] { Array(catalogue.prefix(2)) }
              var rest: [StoreApp] { Array(catalogue.dropFirst(2)) }
              var body: some View {
                  NavigationStack {
                      List {
                          Section(header: Text("Updates Available")) {
                              ForEach(updatable) { app in
                                  AppListRow(app: app, actionLabel: "Update")
                              }
                          }
                          Section(header: Text("Recently Added")) {
                              ForEach(rest) { app in
                                  AppListRow(app: app, actionLabel: "Install")
                              }
                          }
                          Section { Spacer().frame(height: 80).listRowBackground(Color.clear) }
                      }
                      .listStyle(.plain)
                      .navigationTitle("Apps")
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              AvatarButton { showProfile = true }
                          }
                      }
                      .sheet(isPresented: $showProfile) { ProfileView() }
                  }
              }
          }

          struct GamesView: View {
              @State private var showProfile = false
              var games: [StoreApp] { catalogue.filter { $0.category == "Games" } }
              var body: some View {
                  NavigationStack {
                      ScrollView {
                          VStack(alignment: .leading, spacing: 20) {
                              if let first = games.first {
                                  NavigationLink(destination: AppDetailView(app: first)) {
                                      FeatureCard(eyebrow: "GAME OF THE DAY", title: first.name, subtitle: first.desc, colors: first.colors, icon: first.icon)
                                  }
                                  .buttonStyle(.plain)
                              }
                              Text("Top Games").font(.title3.bold()).padding(.horizontal)
                              VStack(spacing: 2) {
                                  ForEach(games) { app in
                                      FavouriteRow(app: app)
                                  }
                              }
                              Spacer().frame(height: 90)
                          }
                          .padding(.top, 8)
                      }
                      .navigationTitle("Games")
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              AvatarButton { showProfile = true }
                          }
                      }
                      .sheet(isPresented: $showProfile) { ProfileView() }
                  }
              }
          }

          struct ArcadeView: View {
              @State private var showProfile = false
              var picks: [StoreApp] { catalogue.filter { $0.category == "Entertainment" || $0.category == "Photo & Video" } }
              var body: some View {
                  NavigationStack {
                      ScrollView {
                          VStack(alignment: .leading, spacing: 20) {
                              if let first = picks.first {
                                  NavigationLink(destination: AppDetailView(app: first)) {
                                      FeatureCard(eyebrow: "ARCADE ORIGINAL", title: first.name, subtitle: first.desc, colors: first.colors, icon: first.icon)
                                  }
                                  .buttonStyle(.plain)
                              }
                              Text("Arcade Picks").font(.title3.bold()).padding(.horizontal)
                              VStack(spacing: 2) {
                                  ForEach(picks) { app in
                                      FavouriteRow(app: app)
                                  }
                              }
                              Spacer().frame(height: 90)
                          }
                          .padding(.top, 8)
                      }
                      .navigationTitle("Arcade")
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              AvatarButton { showProfile = true }
                          }
                      }
                      .sheet(isPresented: $showProfile) { ProfileView() }
                  }
              }
          }

          struct CollectionView: View {
              let title: String
              let apps: [StoreApp]
              var body: some View {
                  List {
                      ForEach(apps) { app in
                          AppListRow(app: app, actionLabel: "Install")
                      }
                  }
                  .listStyle(.plain)
                  .navigationTitle(title)
                  .navigationBarTitleDisplayMode(.large)
              }
          }

          struct AppRow: View {
              let app: StoreApp
              var body: some View {
                  HStack(spacing: 12) {
                      AppIcon(app: app)
                      VStack(alignment: .leading, spacing: 3) {
                          Text(app.name).font(.headline)
                          Text("\(app.developer) - \(app.category)").font(.caption).foregroundColor(.secondary)
                          HStack(spacing: 4) {
                              Stars(rating: app.rating)
                              Text(app.reviews).font(.caption2).foregroundColor(.secondary)
                          }
                      }
                      Spacer()
                      GetButton(app: app)
                  }
                  .padding(.vertical, 4)
              }
          }

          struct GetButton: View {
              @EnvironmentObject var store: StoreModel
              let app: StoreApp
              var light: Bool = false
              var body: some View {
                  let item = store.item(for: app)
                  Button(action: {
                      if let item = item, item.state == .installed {
                          store.showToast("Demo mode - apps cannot really run inside the sandbox")
                      } else {
                          store.start(app)
                      }
                  }) {
                      Group {
                          if let item = item {
                              switch item.state {
                              case .downloading:
                                  ProgressView(value: item.progress).progressViewStyle(.circular)
                              case .paused:
                                  Image(systemName: "play.fill").font(.caption.bold())
                              case .installing:
                                  ProgressView().progressViewStyle(.circular)
                              case .installed:
                                  Text("OPEN").font(.caption.bold())
                              default:
                                  Text("GET").font(.caption.bold())
                              }
                          } else {
                              Text("GET").font(.caption.bold())
                          }
                      }
                      .foregroundColor(light ? .white : .accentColor)
                      .frame(width: 72, height: 30)
                      .background(light ? AnyShapeStyle(.white.opacity(0.25)) : AnyShapeStyle(.ultraThinMaterial))
                      .cornerRadius(15)
                      .overlay(RoundedRectangle(cornerRadius: 15).stroke(.white.opacity(light ? 0.7 : 0.4), lineWidth: 1))
                  }
                  .buttonStyle(.plain)
              }
          }

          struct SearchView: View {
              @AppStorage("dde_recent") private var recentRaw: String = ""
              @State private var query = ""
              @State private var filterCat = "All"

              let filterCats = ["All", "Productivity", "Social Media", "Entertainment", "Utilities", "Games", "Photo & Video"]

              var recent: [String] { recentRaw.isEmpty ? [] : recentRaw.components(separatedBy: "|") }

              var results: [StoreApp] {
                  let q = query.trimmingCharacters(in: .whitespaces).lowercased()
                  guard !q.isEmpty else { return [] }
                  return catalogue.filter {
                      (filterCat == "All" || $0.category == filterCat) &&
                      ($0.name.lowercased().contains(q) ||
                       $0.category.lowercased().contains(q) ||
                       $0.developer.lowercased().contains(q))
                  }
              }

              func addRecent(_ term: String) {
                  var list = recent.filter { $0 != term }
                  list.insert(term, at: 0)
                  recentRaw = Array(list.prefix(8)).joined(separator: "|")
              }

              var body: some View {
                  NavigationStack {
                      VStack(spacing: 0) {
                          HStack(spacing: 10) {
                              Image(systemName: "magnifyingglass").foregroundColor(.secondary)
                              TextField("Apps, games, developers", text: $query, onCommit: {
                                  if !query.isEmpty { addRecent(query) }
                              })
                              .autocapitalization(.none)
                              .disableAutocorrection(true)
                              if !query.isEmpty {
                                  Button(action: { query = "" }) {
                                      Image(systemName: "xmark.circle.fill").foregroundColor(.secondary)
                                  }
                              }
                          }
                          .padding(12)
                          .background(.ultraThinMaterial)
                          .cornerRadius(16)
                          .overlay(RoundedRectangle(cornerRadius: 16).stroke(.white.opacity(0.35), lineWidth: 1))
                          .padding(.horizontal)
                          .padding(.top)

                          ScrollView(.horizontal, showsIndicators: false) {
                              HStack(spacing: 8) {
                                  ForEach(filterCats, id: \.self) { cat in
                                      Button(action: { filterCat = cat }) {
                                          Text(cat)
                                              .font(.caption.bold())
                                              .padding(.horizontal, 12)
                                              .padding(.vertical, 7)
                                              .background(filterCat == cat ? Color.accentColor.opacity(0.18) : Color.clear)
                                              .background(.ultraThinMaterial)
                                              .cornerRadius(14)
                                              .overlay(Capsule().stroke(filterCat == cat ? Color.accentColor : .white.opacity(0.35), lineWidth: 1))
                                      }
                                      .buttonStyle(.plain)
                                  }
                              }
                              .padding(.horizontal)
                          }
                          .padding(.bottom, 8)

                          if query.isEmpty {
                              List {
                                  if !recent.isEmpty {
                                      Section(header: HStack {
                                          Text("Recent Searches")
                                          Spacer()
                                          Button("Clear") { recentRaw = "" }.font(.caption)
                                      }.textCase(nil)) {
                                          ForEach(recent, id: \.self) { term in
                                              Button(action: { query = term }) {
                                                  HStack {
                                                      Image(systemName: "clock").foregroundColor(.secondary)
                                                      Text(term).foregroundColor(.primary)
                                                  }
                                              }
                                          }
                                      }
                                  }
                                  Section(header: Text("Trending").textCase(nil)) {
                                      ForEach(["photo editor", "games", "music", "notes", "fitness"], id: \.self) { term in
                                          Button(action: { query = term; addRecent(term) }) {
                                              HStack {
                                                  Image(systemName: "arrow.up.right").foregroundColor(.secondary)
                                                  Text(term).foregroundColor(.primary)
                                              }
                                          }
                                      }
                                  }
                              }
                              .listStyle(.plain)
                          } else if results.isEmpty {
                              VStack(spacing: 12) {
                                  Spacer()
                                  Image(systemName: "questionmark.app.dashed").font(.system(size: 52)).foregroundColor(.secondary)
                                  Text("No results for \"\(query)\"").font(.headline)
                                  Text("Try a different name or category.").font(.subheadline).foregroundColor(.secondary)
                                  Spacer()
                              }
                              .frame(maxWidth: .infinity)
                          } else {
                              List(results) { app in
                                  NavigationLink(destination: AppDetailView(app: app)) {
                                      AppRow(app: app)
                                  }
                              }
                              .listStyle(.plain)
                          }
                          Spacer().frame(height: 80)
                      }
                      .navigationTitle("Search")
                  }
              }
          }

          struct DownloadsView: View {
              @EnvironmentObject var store: StoreModel
              var active: [DownloadItem] { store.downloads.filter { [.downloading, .paused, .installing].contains($0.state) } }
              var history: [DownloadItem] { store.downloads.filter { [.installed, .canceled, .failed].contains($0.state) } }
              var body: some View {
                  NavigationStack {
                      Group {
                          if store.downloads.isEmpty {
                              VStack(spacing: 12) {
                                  Spacer()
                                  Image(systemName: "arrow.down.circle").font(.system(size: 52)).foregroundColor(.secondary)
                                  Text("No downloads yet").font(.headline)
                                  Text("Tap GET on any app and it will show up here.").font(.subheadline).foregroundColor(.secondary).multilineTextAlignment(.center).padding(.horizontal, 40)
                                  Spacer()
                              }
                              .frame(maxWidth: .infinity)
                          } else {
                              List {
                                  if !active.isEmpty {
                                      Section(header: Text("Active").textCase(nil)) {
                                          ForEach(active) { item in DownloadRow(item: item) }
                                      }
                                  }
                                  if !history.isEmpty {
                                      Section(header: HStack {
                                          Text("History")
                                          Spacer()
                                          Button("Clear") { store.clearHistory() }.font(.caption)
                                      }.textCase(nil)) {
                                          ForEach(history) { item in DownloadRow(item: item) }
                                      }
                                  }
                              }
                              .listStyle(.plain)
                          }
                      }
                      .navigationTitle("Downloads")
                  }
              }
          }

          struct DownloadRow: View {
              @EnvironmentObject var store: StoreModel
              let item: DownloadItem
              var body: some View {
                  HStack(spacing: 12) {
                      AppIcon(app: item.app, size: 48)
                      VStack(alignment: .leading, spacing: 4) {
                          Text(item.app.name).font(.headline)
                          if item.state == .downloading || item.state == .installing {
                              ProgressView(value: item.progress)
                              Text(item.state == .downloading
                                   ? "\(Int(item.progress * 100))% of \(item.app.sizeMB) MB - \(String(format: "%.1f", item.speed)) MB/s"
                                   : "Installing...").font(.caption).foregroundColor(.secondary)
                          } else {
                              Text(item.state.rawValue + (item.state == .installed ? " (demo)" : ""))
                                  .font(.caption)
                                  .foregroundColor(item.state == .installed ? .green : .secondary)
                          }
                      }
                      Spacer()
                      HStack(spacing: 14) {
                          switch item.state {
                          case .downloading:
                              Button(action: { store.pause(item.id) }) { Image(systemName: "pause.fill") }
                              Button(action: { store.cancel(item.id) }) { Image(systemName: "xmark") }
                          case .paused:
                              Button(action: { store.resume(item.id) }) { Image(systemName: "play.fill") }
                              Button(action: { store.cancel(item.id) }) { Image(systemName: "xmark") }
                          case .failed:
                              Button(action: { store.retry(item.id) }) { Image(systemName: "arrow.clockwise") }
                          case .installed:
                              Button(action: { store.showToast("Demo mode - apps cannot really run inside the sandbox") }) { Text("OPEN").font(.caption.bold()) }
                          default:
                              EmptyView()
                          }
                      }
                      .foregroundColor(.accentColor)
                  }
                  .padding(.vertical, 4)
              }
          }

          struct InfoChip: View {
              let value: String
              let label: String
              var body: some View {
                  VStack(spacing: 2) {
                      Text(value).font(.subheadline.bold())
                      Text(label).font(.caption2).foregroundColor(.secondary)
                  }
                  .frame(maxWidth: .infinity)
                  .padding(.vertical, 10)
                  .background(.ultraThinMaterial)
                  .cornerRadius(14)
                  .overlay(RoundedRectangle(cornerRadius: 14).stroke(.white.opacity(0.3), lineWidth: 1))
              }
          }

          struct AppDetailView: View {
              @EnvironmentObject var store: StoreModel
              let app: StoreApp
              var body: some View {
                  ScrollView {
                      VStack(alignment: .leading, spacing: 20) {
                          HStack(spacing: 16) {
                              AppIcon(app: app, size: 92)
                              VStack(alignment: .leading, spacing: 6) {
                                  Text(app.name).font(.title2.bold())
                                  Text(app.developer).font(.subheadline).foregroundColor(.accentColor)
                                  GetButton(app: app)
                              }
                              Spacer()
                          }
                          .padding(.horizontal)

                          HStack(spacing: 10) {
                              InfoChip(value: String(format: "%.1f", app.rating), label: "Rating")
                              InfoChip(value: app.reviews, label: "Reviews")
                              InfoChip(value: "\(app.sizeMB) MB", label: "Size")
                              InfoChip(value: "v\(app.version)", label: "Version")
                          }
                          .padding(.horizontal)

                          VStack(alignment: .leading, spacing: 10) {
                              Text("Preview").font(.title3.bold())
                              ScrollView(.horizontal, showsIndicators: false) {
                                  HStack(spacing: 12) {
                                      ForEach(0..<3, id: \.self) { i in
                                          ZStack {
                                              LinearGradient(colors: app.colors, startPoint: .topLeading, endPoint: .bottomTrailing)
                                              Image(systemName: app.icon).font(.system(size: 44)).foregroundColor(.white.opacity(0.8))
                                          }
                                          .frame(width: 170, height: 300)
                                          .cornerRadius(18)
                                          .overlay(RoundedRectangle(cornerRadius: 18).stroke(.white.opacity(0.35), lineWidth: 1))
                                      }
                                  }
                                  .padding(.horizontal)
                              }
                          }
                          .padding(.horizontal, 0)
                          .padding(.leading)

                          VStack(alignment: .leading, spacing: 8) {
                              Text("About").font(.title3.bold())
                              Text(app.desc).font(.subheadline).foregroundColor(.secondary)
                          }
                          .padding(.horizontal)

                          VStack(alignment: .leading, spacing: 8) {
                              Text("What's New").font(.title3.bold())
                              Text("Version \(app.version)").font(.caption).foregroundColor(.secondary)
                              Text(app.whatsNew).font(.subheadline).foregroundColor(.secondary)
                          }
                          .padding(.horizontal)

                          VStack(alignment: .leading, spacing: 8) {
                              Text("Ratings & Reviews").font(.title3.bold())
                              HStack(spacing: 16) {
                                  Text(String(format: "%.1f", app.rating)).font(.system(size: 48, weight: .bold))
                                  VStack(alignment: .leading) {
                                      Stars(rating: app.rating)
                                      Text("\(app.reviews) ratings").font(.caption).foregroundColor(.secondary)
                                  }
                              }
                          }
                          .padding(.horizontal)

                          VStack(alignment: .leading, spacing: 8) {
                              Text("Permissions").font(.title3.bold())
                              if app.permissions.isEmpty {
                                  Text("No special permissions required.").font(.subheadline).foregroundColor(.secondary)
                              } else {
                                  ForEach(app.permissions, id: \.self) { p in
                                      HStack(spacing: 10) {
                                          Image(systemName: "checkmark.shield.fill").foregroundColor(.green)
                                          Text(p).font(.subheadline)
                                      }
                                  }
                              }
                          }
                          .padding(.horizontal)

                          Spacer().frame(height: 100)
                      }
                      .padding(.top, 8)
                  }
                  .navigationBarTitleDisplayMode(.inline)
                  .onAppear { store.recordView(app) }
                  .toolbar {
                      ToolbarItem(placement: .navigationBarTrailing) {
                          HStack(spacing: 16) {
                              Button(action: { store.toggleSave(app) }) {
                                  Image(systemName: store.isSaved(app) ? "heart.fill" : "heart")
                                      .foregroundColor(store.isSaved(app) ? .red : .accentColor)
                              }
                              ShareLink(item: "Check out \(app.name) on DDE Glass Store (demo)!") {
                                  Image(systemName: "square.and.arrow.up")
                              }
                          }
                      }
                  }
              }
          }

          struct ProfileView: View {
              @EnvironmentObject var store: StoreModel
              @AppStorage("dde_theme") private var theme: String = "system"
              @AppStorage("dde_wifi_only") private var wifiOnly: Bool = false
              @AppStorage("dde_notif") private var notif: Bool = true
              var body: some View {
                  NavigationStack {
                      List {
                          Section {
                              HStack(spacing: 14) {
                                  ZStack {
                                      Circle().fill(LinearGradient(colors: [.blue, .purple], startPoint: .topLeading, endPoint: .bottomTrailing))
                                      Text("R").font(.title2.bold()).foregroundColor(.white)
                                  }
                                  .frame(width: 56, height: 56)
                                  VStack(alignment: .leading, spacing: 2) {
                                      Text("Rutik").font(.headline)
                                      Text("Demo account - sandbox only").font(.caption).foregroundColor(.secondary)
                                  }
                              }
                              .padding(.vertical, 4)
                          }

                          Section(header: Text("Appearance").textCase(nil)) {
                              Picker("Theme", selection: $theme) {
                                  Text("System").tag("system")
                                  Text("Light").tag("light")
                                  Text("Dark").tag("dark")
                              }
                          }

                          Section(header: Text("Download Preferences").textCase(nil)) {
                              Toggle("Download on Wi-Fi only", isOn: $wifiOnly)
                              Toggle("Download notifications", isOn: $notif)
                          }

                          Section(header: Text("Storage").textCase(nil)) {
                              let total = store.downloads.filter { $0.state == .installed }.reduce(0) { $0 + $1.app.sizeMB }
                              HStack {
                                  Text("Used by installed apps (demo)")
                                  Spacer()
                                  Text("\(total) MB").foregroundColor(.secondary)
                              }
                              Button("Clear download history") { store.clearHistory() }
                          }

                          Section(header: Text("About").textCase(nil)) {
                              HStack {
                                  Text("DDE Store")
                                  Spacer()
                                  Text("v1.0.0 (iOS demo)").foregroundColor(.secondary)
                              }
                              Button("Privacy Policy") { store.showToast("Demo build - no data leaves this sandbox") }
                              Button("About DDE Store") { store.showToast("DDE Store demo, built with SwiftUI") }
                          }
                      }
                      .navigationTitle("Profile")
                  }
              }
          }
          struct AppLibRow: View {
              let app: StoreApp
              let subtitle: String
              var body: some View {
                  HStack(spacing: 12) {
                      AppIcon(app: app, size: 46)
                      VStack(alignment: .leading, spacing: 2) {
                          Text(app.name).font(.headline)
                          Text(subtitle).font(.caption).foregroundColor(.secondary).lineLimit(1)
                      }
                  }
                  .padding(.vertical, 4)
              }
          }

          // MARK: - Library
          struct LibraryView: View {
              @EnvironmentObject var store: StoreModel

              var installed: [DownloadItem] { store.downloads.filter { $0.state == .installed } }
              var savedApps: [StoreApp] { store.saved.compactMap { n in catalogue.first { $0.name == n } } }
              var recentApps: [StoreApp] { store.recentViews.compactMap { n in catalogue.first { $0.name == n } } }
              var updatable: [StoreApp] {
                  let installedNames = Set(installed.map { $0.app.name })
                  return catalogue.filter { !installedNames.contains($0.name) }.prefix(2).map { $0 }
              }

              @ViewBuilder var savedSection: some View {
                  Section(header: Text("Saved")) {
                      if savedApps.isEmpty {
                          Text("Nothing saved yet. Tap the heart on any app to save it here.")
                              .font(.subheadline).foregroundColor(.secondary)
                      } else {
                          ForEach(savedApps) { app in
                              NavigationLink(destination: AppDetailView(app: app)) {
                                  AppLibRow(app: app, subtitle: app.category)
                              }
                          }
                      }
                  }
              }

              @ViewBuilder var recentSection: some View {
                  Section(header: Text("Recently Viewed")) {
                      if recentApps.isEmpty {
                          Text("Apps you open will show up here.")
                              .font(.subheadline).foregroundColor(.secondary)
                      } else {
                          ForEach(recentApps) { app in
                              NavigationLink(destination: AppDetailView(app: app)) {
                                  AppLibRow(app: app, subtitle: app.developer)
                              }
                          }
                      }
                  }
              }

              var body: some View {
                  NavigationStack {
                      List {
                          if !updatable.isEmpty {
                              Section(header: Text("Updates")) {
                                  ForEach(updatable) { app in
                                      HStack(spacing: 12) {
                                          AppIcon(app: app, size: 46)
                                          VStack(alignment: .leading, spacing: 2) {
                                              Text(app.name).font(.headline)
                                              Text("Update available (demo)").font(.caption).foregroundColor(.secondary)
                                          }
                                          Spacer()
                                          GetButton(app: app)
                                      }
                                      .padding(.vertical, 4)
                                  }
                              }
                          }

                          savedSection
                          recentSection

                          Section(header: Text("Installed (Demo)")) {
                              if installed.isEmpty {
                                  Text("No demo installs yet. Get an app to see it here.")
                                      .font(.subheadline).foregroundColor(.secondary)
                              } else {
                                  ForEach(installed) { item in
                                      HStack(spacing: 12) {
                                          AppIcon(app: item.app, size: 46)
                                          VStack(alignment: .leading, spacing: 2) {
                                              Text(item.app.name).font(.headline)
                                              Text("Simulated install").font(.caption).foregroundColor(.secondary)
                                          }
                                          Spacer()
                                          GetButton(app: item.app)
                                      }
                                      .padding(.vertical, 4)
                                  }
                              }
                          }

                          Section { Spacer().frame(height: 80).listRowBackground(Color.clear) }
                      }
                      .listStyle(.insetGrouped)
                      .navigationTitle("Library")
                  }
              }
          }
          SWIFT
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cat > project.yml <<'YML'
          name: DDEGlassStore
          options:
            bundleIdPrefix: com.rutik
          targets:
            DDEGlassStore:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources: [Sources]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.rutik.ddeglassstore
                  PRODUCT_NAME: DDEGlassStore
                  GENERATE_INFOPLIST_FILE: YES
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
                  INFOPLIST_KEY_CFBundleDisplayName: DDE Glass Store
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
          YML
          xcodegen
      - name: Build for iOS Simulator
        run: xcodebuild -project DDEGlassStore.xcodeproj -scheme DDEGlassStore -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Zip app bundle
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/DDEGlassStore-simulator.zip" DDEGlassStore.app
          cd "$GITHUB_WORKSPACE"
          unzip -l DDEGlassStore-simulator.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDEGlassStore-simulator
          path: DDEGlassStore-simulator.zip
      - name: Publish release with zip
        run: gh release create v5.0.0 DDEGlassStore-simulator.zip --title "DDE Glass Store v5 (iOS Simulator)" --notes "Unsigned iOS Simulator build - DDE Glass Store v5, ultra-fidelity iOS 26 liquid glass UI. Upload DDEGlassStore-simulator.zip to Appetize to run it."
        env:
          GH_TOKEN: ${{ github.token }}
