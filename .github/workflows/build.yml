              mkApp("Task Flow", "Nova Works", "Productivity", "checklist", [.blue, .cyan], 4.6, "8.2K", 22, "2.0.4", "Plan your day with smart lists, reminders, and focus timers. Syncs across all your devices.", "Widgets and dark mode polish.", ["Notifications"], true),
              mkApp("Music Wave", "PixelCraft", "Entertainment", "waveform", [.orange, .red], 4.7, "31K", 65, "5.1.0", "Stream unlimited music with spatial audio and offline playlists.", "New equalizer presets.", ["Storage", "Notifications"], true),
              mkApp("Chat Bubble", "DDE Labs", "Social Media", "bubble.left.and.bubble.right.fill", [.green, .mint], 4.5, "19K", 38, "4.4.2", "Fast, private messaging with groups, stickers, and voice notes.", "Voice note waveforms.", ["Contacts", "Microphone", "Notifications"], false),
              mkApp("Fit Track", "Healthify Demo", "Utilities", "figure.run", [.teal, .green], 4.4, "5.1K", 30, "1.9.0", "Track workouts, steps, and sleep with gentle daily goals.", "New streaks view.", ["Motion & Fitness", "Notifications"], false),
              mkApp("Cloud Notes", "Nova Works", "Productivity", "note.text", [.indigo, .blue], 4.6, "9.7K", 18, "3.0.1", "Notes that sync everywhere, with sketches, checklists, and folders.", "Handwriting search.", ["Storage"], false),
              mkApp("Pixel Paint", "PixelCraft", "Photo & Video", "paintbrush.fill", [.pink, .orange], 4.3, "3.4K", 54, "2.7.3", "Draw, paint, and animate with layers and 200+ brushes.", "Time-lapse export.", ["Photos"], false),
              mkApp("Read Wise", "DDE Labs", "Productivity", "book.fill", [.brown, .orange], 4.7, "6.8K", 26, "1.4.0", "Save articles and highlights, read later without distractions.", "Speed reading mode.", [], false),
              mkApp("Space Runner", "Galaxy Demo", "Games", "airplane", [.indigo, .purple], 4.5, "44K", 120, "6.2.0", "Dodge asteroids and upgrade your ship in this endless space runner.", "New galaxy map.", [], true),
              mkApp("Puzzle Pop", "Galaxy Demo", "Games", "circle.grid.3x3.fill", [.mint, .blue], 4.4, "27K", 85, "4.0.2", "Match, pop, and combo through 2,000 relaxing puzzles.", "100 new levels.", [], false),
              mkApp("Castle Siege", "Galaxy Demo", "Games", "shield.lefthalf.filled", [.gray, .black], 4.6, "15K", 210, "2.3.5", "Build your kingdom, train armies, and siege rival castles.", "Clan wars season 4.", ["Notifications"], false),
              mkApp("Weather Glass", "Nova Works", "Utilities", "cloud.sun.fill", [.cyan, .blue], 4.5, "7.9K", 15, "1.2.2", "Hyperlocal forecasts with stunning liquid-glass widgets.", "Radar layer.", ["Location", "Notifications"], false),
              mkApp("File Vault", "DDE Labs", "Utilities", "folder.fill", [.gray, .blue], 4.2, "2.1K", 12, "1.0.8", "Encrypt and organize your files with Face ID protection.", "Faster indexing.", ["Storage", "Face ID"], false),
              mkApp("Stream Box", "PixelCraft", "Entertainment", "play.tv.fill", [.red, .black], 4.6, "52K", 74, "7.1.0", "Movies and shows in 4K with offline downloads.", "New kids mode.", ["Storage"], false),
              mkApp("Habit Spark", "Healthify Demo", "Productivity", "flame.fill", [.orange, .yellow], 4.8, "11K", 19, "2.2.0", "Build habits that stick with tiny daily wins and streaks.", "Shared streaks.", ["Notifications"], false),
              mkApp("Meme Maker", "Galaxy Demo", "Entertainment", "face.smiling", [.yellow, .green], 4.1, "4.4K", 33, "1.5.6", "Turn any photo into a meme in seconds with smart captions.", "New templates.", ["Photos"], false)
          ]

          let categoryList = ["Popular Apps", "Featured Apps", "Recently Added", "Productivity", "Social Media", "Entertainment", "Utilities", "Games"]

          struct GlassCard<Content: View>: View {
              @ViewBuilder var content: Content
              var body: some View {
                  content
                      .padding(14)
                      .background(.ultraThinMaterial)
                      .cornerRadius(20)
                      .overlay(RoundedRectangle(cornerRadius: 20).stroke(.white.opacity(0.35), lineWidth: 1))
                      .shadow(color: .black.opacity(0.10), radius: 10, y: 4)
              }
