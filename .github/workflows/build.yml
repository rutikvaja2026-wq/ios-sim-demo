                      .frame(width: size, height: size)
                      .overlay(Image(systemName: app.icon).font(.system(size: size * 0.42)).foregroundColor(.white))
                      .overlay(RoundedRectangle(cornerRadius: size * 0.24, style: .continuous).stroke(.white.opacity(0.4), lineWidth: 1))
                      .shadow(color: .black.opacity(0.18), radius: 4, y: 2)
              }
          }

          struct Stars: View {
              let rating: Double
              var body: some View {
                  HStack(spacing: 2) {
                      ForEach(0..<5) { i in
                          Image(systemName: Double(i) < rating.rounded(.down) ? "star.fill" : (Double(i) < rating ? "star.lefthalf.filled" : "star"))
                              .font(.caption2)
                              .foregroundColor(.orange)
                      }
                  }
              }
          }

          struct RootView: View {
              @EnvironmentObject var store: StoreModel
              @State private var tab = 0
              @State private var showSearch = false
              var body: some View {
                  ZStack(alignment: .bottom) {
                      Group {
                          switch tab {
                          case 0: TodayView()
                          case 1: GamesView()
                          case 2: AppsView()
                          default: ArcadeView()
                          }
