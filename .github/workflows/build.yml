                                      Spacer()
                                      Image(systemName: "chevron.right").font(.caption.bold()).foregroundColor(.secondary)
                                  }
                                  .padding(14)
                                  .background(.ultraThinMaterial)
                                  .cornerRadius(16)
                                  .overlay(RoundedRectangle(cornerRadius: 16).stroke(.white.opacity(0.3), lineWidth: 1))
                                  .padding(.horizontal)
                              }
                              .buttonStyle(.plain)
                              NavigationLink(destination: AppDetailView(app: featured)) {
                                  FeatureCard(eyebrow: "EDITOR'S CHOICE", title: featured.name, subtitle: featured.desc, colors: featured.colors, icon: featured.icon)
                              }
                              .buttonStyle(.plain)
                              Spacer().frame(height: 90)
