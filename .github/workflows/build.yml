name: Build iOS Simulator App
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Write app source
        run: |
          mkdir -p Sources
          cat > Sources/DDEGlassStore.swift <<'SWIFT'
          import SwiftUI

          @main
          struct DDEStoreApp: App {
              @StateObject private var store = StoreModel()
              @AppStorage("dde_theme") private var theme: String = "system"
              var body: some Scene {
                  WindowGroup {
                      RootView()
                          .environmentObject(store)
                          .preferredColorScheme(theme == "dark" ? .dark : theme == "light" ? .light : nil)
                  }
              }
          }

          struct StoreApp: Identifiable, Hashable {
              let id = UUID()
              let name: String
              let developer: String
              let category: String
              let icon: String
              let colors: [Color]
              let rating: Double
              let reviews: String
              let sizeMB: Int
              let version: String
              let desc: String
              let whatsNew: String
              let permissions: [String]
              let featured: Bool
              func hash(into h: inout Hasher) { h.combine(id) }
              static func == (a: StoreApp, b: StoreApp) -> Bool { a.id == b.id }
          }

          enum DLState: String {
              case downloading = "Downloading"
              case paused = "Paused"
              case installing = "Installing"
              case installed = "Installed"
              case failed = "Failed"
              case canceled = "Canceled"
          }

          struct DownloadItem: Identifiable {
              let id = UUID()
              let app: StoreApp
              var progress: Double
              var speed: Double
              var state: DLState
              var date: Date = Date()
          }

          final class StoreModel: ObservableObject {
              @Published var downloads: [DownloadItem] = []
              @Published var toast: String? = nil
              @Published var saved: [String] = []
              @Published var recentViews: [String] = []
              private var timer: Timer?
              private var toastTimer: Timer?

              init() {
                  saved = Self.loadList("dde_saved")
                  recentViews = Self.loadList("dde_recent_views")
              }

              static func loadList(_ key: String) -> [String] {
                  let raw = UserDefaults.standard.string(forKey: key) ?? ""
                  return raw.isEmpty ? [] : raw.components(separatedBy: "|")
              }

              static func storeList(_ key: String, _ list: [String]) {
                  UserDefaults.standard.set(list.joined(separator: "|"), forKey: key)
              }

              func isSaved(_ app: StoreApp) -> Bool { saved.contains(app.name) }

              func toggleSave(_ app: StoreApp) {
                  if isSaved(app) {
                      saved.removeAll { $0 == app.name }
                      showToast("Removed from Library")
                  } else {
                      saved.insert(app.name, at: 0)
                      showToast("Saved to Library")
                  }
                  Self.storeList("dde_saved", saved)
              }

              func recordView(_ app: StoreApp) {
                  recentViews.removeAll { $0 == app.name }
                  recentViews.insert(app.name, at: 0)
                  recentViews = Array(recentViews.prefix(10))
                  Self.storeList("dde_recent_views", recentViews)
              }

              func showToast(_ text: String) {
                  DispatchQueue.main.async { self.toast = text }
                  toastTimer?.invalidate()
                  toastTimer = Timer.scheduledTimer(withTimeInterval: 2.4, repeats: false) { _ in
                      DispatchQueue.main.async { self.toast = nil }
                  }
              }

              func item(for app: StoreApp) -> DownloadItem? {
                  downloads.first { $0.app.id == app.id && [.downloading, .paused, .installing, .installed].contains($0.state) }
              }

              func start(_ app: StoreApp) {
                  if let existing = item(for: app) {
                      if existing.state == .paused { resume(existing.id) }
                      return
                  }
                  downloads.insert(DownloadItem(app: app, progress: 0, speed: Double.random(in: 0.8...2.4), state: .downloading), at: 0)
                  ensureTimer()
                  showToast("Downloading \(app.name)")
              }

              func pause(_ id: UUID) { setState(id, .paused) }
              func resume(_ id: UUID) { setState(id, .downloading); ensureTimer() }

              func cancel(_ id: UUID) {
                  guard let i = downloads.firstIndex(where: { $0.id == id }) else { return }
                  downloads[i].state = .canceled
                  downloads[i].progress = 0
                  showToast("Download canceled")
              }

              func retry(_ id: UUID) {
                  guard let i = downloads.firstIndex(where: { $0.id == id }) else { return }
                  downloads[i].state = .downloading
                  downloads[i].progress = 0
                  ensureTimer()
              }

              func removeRecord(_ id: UUID) { downloads.removeAll { $0.id == id } }
              func clearHistory() {
                  downloads.removeAll { [.installed, .canceled, .failed].contains($0.state) }
                  showToast("History cleared")
              }

              private func setState(_ id: UUID, _ s: DLState) {
                  guard let i = downloads.firstIndex(where: { $0.id == id }) else { return }
                  downloads[i].state = s
              }

              private func ensureTimer() {
                  guard timer == nil else { return }
                  timer = Timer.scheduledTimer(withTimeInterval: 0.25, repeats: true) { _ in
                      DispatchQueue.main.async { self.tick() }
                  }
              }

              private func tick() {
                  var anyActive = false
                  for i in downloads.indices {
                      guard downloads[i].state == .downloading || downloads[i].state == .installing else { continue }
                      anyActive = true
                      if downloads[i].state == .downloading {
                          let step = downloads[i].speed * 0.25 / Double(downloads[i].app.sizeMB)
                          downloads[i].progress = min(1.0, downloads[i].progress + step)
                          if downloads[i].progress >= 1.0 {
                              downloads[i].state = .installing
                              downloads[i].progress = 0
                          }
                      } else {
                          downloads[i].progress = min(1.0, downloads[i].progress + 0.2)
                          if downloads[i].progress >= 1.0 {
                              downloads[i].state = .installed
                              showToast("\(downloads[i].app.name) installed (demo)")
                          }
                      }
                  }
                  if !anyActive { timer?.invalidate(); timer = nil }
              }
          }

